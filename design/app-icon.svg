<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="-512 -512 1024 1024">
  <!--
    Reflectodoro app icon: a rounded hourglass, tilted 45 degrees clockwise,
    in the Tauri mark's stroke-and-dot style. Coloured with the brand
    gradients defined in docs/index.html:
      warm = light-theme  --brand (#dc4f2c) -> --brand-2 (#ea8c1c)
      cool = dark-theme   --brand (#5b8cff) -> --brand-2 (#22d3ee)
  -->
  <defs>
    <linearGradient id="warm" gradientUnits="userSpaceOnUse" x1="-220" y1="-340" x2="200" y2="-20">
      <stop offset="0" stop-color="#dc4f2c"/>
      <stop offset="1" stop-color="#ea8c1c"/>
    </linearGradient>
    <linearGradient id="cool" gradientUnits="userSpaceOnUse" x1="-200" y1="20" x2="220" y2="340">
      <stop offset="0" stop-color="#5b8cff"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
  </defs>

  <g transform="rotate(45)">
    <g transform="scale(0.93)" fill="none"
       stroke-linejoin="round" stroke-linecap="round" stroke-width="56">

      <!-- upper bulb + end plate -->
      <path d="M 36 0 C 115 -45 210 -120 210 -300 M -36 0 C -115 -45 -210 -120 -210 -300 M -245 -318 L 245 -318" stroke="url(#warm)"/>
      <circle cx="0" cy="-195" r="56" fill="url(#warm)"/>

      <!-- lower bulb + end plate -->
      <path d="M 36 0 C 115 45 210 120 210 300 M -36 0 C -115 45 -210 120 -210 300 M -245 318 L 245 318" stroke="url(#cool)"/>
      <circle cx="0" cy="195" r="56" fill="url(#cool)"/>

    </g>
  </g>
</svg>
