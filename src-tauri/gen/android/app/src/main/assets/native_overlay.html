<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Reflectodoro Break</title>
<style>
  html, body {
    margin: 0;
    min-height: 100%;
    background: #0b0b12;
  }

  body {
    /* Deliberately NOT position: fixed + its own overflow-y: auto -- that
       makes body a nested scroll container instead of letting the document
       itself scroll, and on-device that nested container didn't reliably
       take touch-scroll gestures inside this WindowManager-hosted WebView
       (no scrollbar, dragging did nothing). Plain document-level scrolling
       (the browser engine's most basic, universally-supported path) is used
       instead: body just flows normally and grows past one screen's height
       when content + the keyboard spacer need it. */
    background: linear-gradient(160deg, #10111a 0%, #1b1c2b 100%);
    color: #f3f3f7;
    display: flex;
    flex-direction: column;
    align-items: center;
    font-family: sans-serif;
    -webkit-user-select: none;
    user-select: none;
    box-sizing: border-box;
    /* Fixed top padding rather than env(safe-area-inset-*): this WebView is
       added directly to WindowManager, not laid out through the Activity's
       own edge-to-edge/WindowInsets pipeline, so safe-area-inset support
       here is unverified -- a generous fixed value is the simpler, reliably
       correct choice for a status-bar-height allowance. */
    padding: 40px 20px 24px;
  }

  .dev-close {
    position: fixed;
    top: 40px;
    right: 20px;
    background: #b3261e;
    color: white;
    border: none;
    border-radius: 6px;
    padding: 6px 12px;
    font-size: 13px;
    z-index: 10;
  }

  .clock {
    position: fixed;
    top: 44px;
    left: 20px;
    margin: 0;
    font-variant-numeric: tabular-nums;
    font-size: 13px;
    letter-spacing: 0.04em;
    opacity: 0.55;
  }

  .stack {
    display: flex;
    flex-direction: column;
    gap: 16px;
    width: min(480px, 100%);
    /* Centers when everything fits; once the keyboard/spacer push total
       content taller than the viewport, the auto margins collapse to 0 and
       scrolling (body's overflow-y: auto) takes over instead. */
    margin: auto 0;
  }

  .panel {
    background: rgba(255, 255, 255, 0.04);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 16px;
    padding: 24px;
    box-sizing: border-box;
  }

  h2 {
    font-size: 15px;
    margin: 0 0 12px;
    opacity: 0.85;
  }

  /* Blank scroll room at the end of the content so a field near the bottom
     (breakit input, task list) can still be scrolled up above the on-screen
     keyboard. Height is set from JS -- a generous static minimum plus
     whatever visualViewport reports the keyboard is actually covering, since
     this WebView is added straight to WindowManager rather than hosted by an
     Activity, and it's unverified whether keyboard-triggered resize behaves
     identically to the regular in-app /overlay page in that context. */
  .spacer {
    flex-shrink: 0;
    width: 100%;
  }

  .timer {
    font-variant-numeric: tabular-nums;
    font-size: 14px;
    opacity: 0.7;
    margin: 0 0 8px;
  }

  h1 {
    font-size: 20px;
    margin: 0 0 16px;
  }

  textarea, input {
    width: 100%;
    box-sizing: border-box;
    background: rgba(0, 0, 0, 0.25);
    border: 1px solid rgba(255, 255, 255, 0.15);
    border-radius: 10px;
    color: inherit;
    font-family: inherit;
    font-size: 14px;
    padding: 10px 12px;
    resize: vertical;
  }

  button {
    margin-top: 10px;
    background: #5865f2;
    color: white;
    border: none;
    border-radius: 8px;
    padding: 10px 18px;
    font-size: 14px;
  }

  button:disabled {
    opacity: 0.4;
  }

  .breakit {
    margin-top: 24px;
    padding-top: 20px;
    border-top: 1px solid rgba(255, 255, 255, 0.08);
  }

  label {
    display: block;
    font-size: 13px;
    opacity: 0.8;
    margin-bottom: 8px;
  }

  .hint {
    font-size: 12px;
    opacity: 0.6;
    margin-top: 8px;
  }

  .hint.ok {
    color: #8fd19e;
  }

  .challenge {
    font-family: ui-monospace, monospace;
    font-size: 18px;
    letter-spacing: 0.1em;
    background: rgba(0, 0, 0, 0.35);
    border: 1px solid rgba(255, 255, 255, 0.15);
    border-radius: 8px;
    padding: 12px 14px;
    margin: 0 0 12px;
    word-break: break-all;
  }

  input.shake {
    animation: shake 0.3s;
    border-color: #e15b5b;
  }

  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-6px); }
    75% { transform: translateX(6px); }
  }
</style>
</head>
<body>
  <button id="dev-close" class="dev-close" style="display:none">Close (DEV)</button>
  <p id="clock" class="clock"></p>

  <div class="stack">
    <section class="panel">
      <p class="timer" id="timer">--:--</p>
      <h1>What did I do since your last break?</h1>

      <textarea id="reflection" rows="5" placeholder="Write a couple of bullet points or type 'Skip' to skip it."></textarea>
      <div id="reflection-actions">
        <button id="submit-reflection" disabled>Submit reflection</button>
      </div>
      <p id="reflection-saved" class="hint ok" style="display:none">Saved. Waiting on the other condition to finish the break.</p>

      <div class="breakit">
        <div id="breakit-pending">
          <label for="breakit-input">To close this window early, type this code and press Enter</label>
          <p class="challenge" id="challenge"></p>
          <input id="breakit-input" type="text" autocomplete="off" spellcheck="false" enterkeyhint="done"
            placeholder="type the code above, then press Enter" />
        </div>
        <p id="breakit-matched" class="hint ok" style="display:none">Code matched.</p>
        <p class="hint">Reflection is still required either way.</p>
      </div>
    </section>

    <section class="panel">
      <h2>Most Important Tasks Today</h2>
      <textarea id="task-list" rows="5" placeholder="1.&#10;2.&#10;3."></textarea>
      <p class="hint">Auto-saves as you type.</p>
    </section>

    <section class="panel">
      <h2>Not To Do Tasks Today</h2>
      <textarea id="not-to-do-list" rows="3" placeholder="1.&#10;2.&#10;3."></textarea>
      <p class="hint">Auto-saves as you type.</p>
    </section>
  </div>

  <div id="spacer" class="spacer"></div>

  <script>
    var state = {
      open: false,
      reflection_entered: false,
      breakit_challenge: "",
      breakit_matched: false,
      time_expired: false,
      current_slot_start: "",
      dev_mode: false,
      task_list_content: "",
      not_to_do_content: "",
    };
    var pendingBreakitCheck = false;
    var taskSaveTimer = null;
    var notToDoSaveTimer = null;

    var reflectionEl = document.getElementById("reflection");
    var submitBtn = document.getElementById("submit-reflection");
    var reflectionSavedEl = document.getElementById("reflection-saved");
    var breakitInputEl = document.getElementById("breakit-input");
    var breakitPendingEl = document.getElementById("breakit-pending");
    var breakitMatchedEl = document.getElementById("breakit-matched");
    var challengeEl = document.getElementById("challenge");
    var clockEl = document.getElementById("clock");
    var timerEl = document.getElementById("timer");
    var devCloseEl = document.getElementById("dev-close");
    var taskListEl = document.getElementById("task-list");
    var notToDoListEl = document.getElementById("not-to-do-list");
    var spacerEl = document.getElementById("spacer");

    function pad(n) { return String(n).padStart(2, "0"); }

    function renderClock() {
      var now = new Date();
      clockEl.textContent = pad(now.getHours()) + ":" + pad(now.getMinutes());

      if (state.current_slot_start) {
        var end = new Date(state.current_slot_start).getTime() + 5 * 60 * 1000;
        var remaining = Math.max(0, Math.round((end - now.getTime()) / 1000));
        if (remaining > 0) {
          timerEl.textContent = Math.floor(remaining / 60) + ":" + pad(remaining % 60);
        } else {
          timerEl.textContent = "Time's up";
        }
      }
    }
    setInterval(renderClock, 1000);
    renderClock();

    function render() {
      devCloseEl.style.display = state.dev_mode ? "" : "none";
      challengeEl.textContent = state.breakit_challenge;

      reflectionEl.disabled = state.reflection_entered;
      submitBtn.style.display = state.reflection_entered ? "none" : "";
      reflectionSavedEl.style.display = state.reflection_entered ? "" : "none";

      breakitPendingEl.style.display = state.breakit_matched ? "none" : "";
      breakitMatchedEl.style.display = state.breakit_matched ? "" : "none";

      if (pendingBreakitCheck) {
        pendingBreakitCheck = false;
        if (!state.breakit_matched) {
          breakitInputEl.classList.add("shake");
          setTimeout(function () { breakitInputEl.classList.remove("shake"); }, 300);
        }
      }

      // Never while the field has focus -- a push triggered by something
      // unrelated (e.g. a breakit attempt) would otherwise clobber
      // in-progress typing with the last value Rust knew about.
      if (document.activeElement !== taskListEl) {
        taskListEl.value = state.task_list_content;
      }
      if (document.activeElement !== notToDoListEl) {
        notToDoListEl.value = state.not_to_do_content;
      }
    }

    // Called by NativeOverlayManager.pushState via evaluateJavascript.
    window.__updateOverlayState = function (json) {
      try {
        var next = JSON.parse(json);
        var newSlot = next.current_slot_start !== state.current_slot_start;
        state = next;
        // Reflection/breakit are per-slot and reset on a new one; the task
        // list is per-day, not per-slot, so it deliberately isn't cleared
        // here.
        if (newSlot) {
          reflectionEl.value = "";
          breakitInputEl.value = "";
        }
        render();
      } catch (e) {
        // Malformed push -- ignore rather than throw, leaves the last known
        // good state showing instead of a blank/broken page.
      }
    };

    reflectionEl.addEventListener("input", function () {
      submitBtn.disabled = reflectionEl.value.trim().length === 0;
    });

    submitBtn.addEventListener("click", function () {
      var text = reflectionEl.value.trim();
      if (!text || state.reflection_entered) return;
      submitBtn.disabled = true;
      window.AndroidBridge.submitReflection(text);
    });

    function blockCopyPaste(e) { e.preventDefault(); }
    breakitInputEl.addEventListener("paste", blockCopyPaste);
    breakitInputEl.addEventListener("drop", blockCopyPaste);
    breakitInputEl.addEventListener("contextmenu", blockCopyPaste);

    breakitInputEl.addEventListener("keydown", function (e) {
      if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "v") {
        e.preventDefault();
        return;
      }
      if (e.shiftKey && e.key === "Insert") {
        e.preventDefault();
        return;
      }
      if (e.key !== "Enter") return;
      e.preventDefault();
      var val = breakitInputEl.value.trim();
      breakitInputEl.value = "";
      if (!val || state.breakit_matched) return;
      pendingBreakitCheck = true;
      window.AndroidBridge.breakitAttempt(val);
    });

    devCloseEl.addEventListener("click", function () {
      window.AndroidBridge.devForceClose();
    });

    taskListEl.addEventListener("input", function () {
      if (taskSaveTimer) clearTimeout(taskSaveTimer);
      taskSaveTimer = setTimeout(function () {
        window.AndroidBridge.saveTaskList(taskListEl.value);
      }, 800);
    });

    notToDoListEl.addEventListener("input", function () {
      if (notToDoSaveTimer) clearTimeout(notToDoSaveTimer);
      notToDoSaveTimer = setTimeout(function () {
        window.AndroidBridge.saveNotToDoList(notToDoListEl.value);
      }, 800);
    });

    /** window.innerHeight never shrinks when the keyboard opens here (see
     * __setKeyboardInset below for why), so a plain scrollIntoView({block:
     * "center"}) would center against the *full* screen height and could
     * still land a field behind the keyboard. This scrolls only as far as needed
     * to clear whatever nativeKeyboardInset currently says is covered,
     * measured against the field's actual position. */
    function scrollFieldAboveKeyboard(el) {
      var rect = el.getBoundingClientRect();
      var visibleBottom = window.innerHeight - nativeKeyboardInset;
      var margin = 16;
      if (rect.bottom > visibleBottom - margin) {
        window.scrollBy({ top: rect.bottom - visibleBottom + margin, behavior: "smooth" });
      } else if (rect.top < margin) {
        window.scrollBy({ top: rect.top - margin, behavior: "smooth" });
      }
    }
    function onFieldFocus(e) {
      // Handles the case where the keyboard is already up (switching focus
      // between fields); __setKeyboardInset handles the case where focus
      // triggers the keyboard to open in the first place, since the real
      // height isn't known yet at focus time.
      setTimeout(function () { scrollFieldAboveKeyboard(e.currentTarget); }, 150);
    }
    reflectionEl.addEventListener("focus", onFieldFocus);
    breakitInputEl.addEventListener("focus", onFieldFocus);
    taskListEl.addEventListener("focus", onFieldFocus);
    notToDoListEl.addEventListener("focus", onFieldFocus);

    /** Sizes the trailing spacer so there's always room to scroll a focused
     * field above the on-screen keyboard, and re-scrolls the focused field
     * once the real height is known. visualViewport is left wired up but
     * doesn't fix this on its own: this WebView sits in a
     * TYPE_APPLICATION_OVERLAY window, and Android's automatic IME
     * resize/pan (what visualViewport's resize event depends on) only
     * applies to application window types, not system overlay ones -- a
     * real device test showed the keyboard covering fields with only the
     * visualViewport/static-floor spacer in place. The real height instead
     * comes from Kotlin (NativeOverlayManager's getWindowVisibleDisplayFrame
     * -based listener, which isn't gated on window type the same way),
     * with visualViewport and a static floor kept as harmless extra
     * signals in case either ever does help. */
    var nativeKeyboardInset = 0;
    window.__setKeyboardInset = function (px) {
      nativeKeyboardInset = px || 0;
      updateSpacer();
      var active = document.activeElement;
      if (nativeKeyboardInset > 0 && (active === reflectionEl || active === breakitInputEl || active === taskListEl || active === notToDoListEl)) {
        scrollFieldAboveKeyboard(active);
      }
    };
    function updateSpacer() {
      var vv = window.visualViewport;
      var vvInset = vv ? Math.max(0, window.innerHeight - vv.height) : 0;
      spacerEl.style.height = Math.max(220, nativeKeyboardInset, vvInset) + "px";
    }
    if (window.visualViewport) {
      window.visualViewport.addEventListener("resize", updateSpacer);
    }
    updateSpacer();

    render();
  </script>
</body>
</html>
