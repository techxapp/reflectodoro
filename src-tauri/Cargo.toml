[package]
name = "reflectodoro"
version = "0.14.1"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[profile.release]
strip = "debuginfo" # keeps the symbol table for Play Console native crash symbolication -- see CLAUDE.md "Known gotchas"
lto = true
codegen-units = 1
panic = "abort"

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "reflectodoro_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-notification = "2"
tauri-plugin-dialog = "2"
tauri-plugin-log = "2"
tauri-plugin-http = "2.0"
log = "0.4"
# Backs the About page's "export last N log files" archive feature
# (log_export.rs). default-features=false + this one feature skips the
# crate's default codec bundle (bzip2/lzma/zstd/ppmd/aes, several of which
# are C-backed and not worth dragging into the Android/iOS cross-compile) --
# deflate-flate2-zlib-rs is a pure-Rust zlib reimplementation, plenty for
# zipping a handful of small plain-text log files.
zip = { version = "4", default-features = false, features = ["deflate-flate2-zlib-rs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
# "net" backs p2p_sync.rs's direct TCP pairing/sync connections (raw
# tokio::net::{TcpListener,TcpStream}, not a Tauri plugin -- see that file).
tokio = { version = "1", features = ["time", "net"] }
anyhow = "1"
rand = "0.8"
# p2p_sync.rs: turns the one-time pairing PIN into a strong shared key via a
# password-authenticated key exchange, so a passive LAN eavesdropper on the
# pairing handshake can't offline-brute-force the (short, human-typed) PIN --
# see p2p_sync.rs's module doc comment for the full threat model.
spake2 = "0.4"
# p2p_sync.rs: Noise Protocol Framework, encrypts/authenticates every sync
# session (not just pairing) using the shared key a device stored for that
# peer at pairing time.
snow = "0.9"
# A second, direct connection to the same pomodoro.db tauri-plugin-sql
# already manages, opened via db::open_direct_pool -- needed wherever a
# write must be genuinely atomic (import.rs's transactional import/merge) or
# where nothing else can reach the DB via Tauri IPC at all (native_overlay.rs
# on Android, whose plain WebView has no Tauri IPC of its own). Unconditional
# (not just Android) since import.rs runs on every platform; SQLite handles
# multiple connections to one file fine at this app's write volume.
sqlx = { version = "0.8", features = ["sqlite", "runtime-tokio"] }
# Backs commands::fetch_quote (the configurable break-screen quote API, see
# CLAUDE.md's "Quote API" section) -- used directly rather than through
# tauri-plugin-http, since that plugin's capability model expects a fixed URL
# allowlist in capabilities/*.json and this feature's URL is user-supplied and
# arbitrary. default-features=false drops reqwest's own TLS-backend default
# (native-tls) in favor of rustls, avoiding a second TLS stack alongside
# whatever else in the dependency tree already pulls one in.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
# crypto.rs: field-level encryption at rest for the three user-typed text
# columns (see CLAUDE.md's "Encryption at rest"). XChaCha20-Poly1305 rather
# than AES-256-GCM specifically for its 192-bit nonce: large enough to
# generate fresh at random on every single call with no realistic collision
# risk at any volume this app could produce, and therefore no shared counter
# or coordination needed between the several independent call sites that
# encrypt (the Tauri command db.ts invokes, import.rs's merge-then-rewrite,
# and native_overlay.rs on Android). A nonce derived from another column
# would be actively wrong here -- reflection edits rewrite `text` for the
# same id/slot_start_at, so a derived nonce would repeat across different
# plaintexts under one key, which is the catastrophic failure mode for both
# GCM and ChaCha20-Poly1305.
chacha20poly1305 = "0.10"
# Ciphertext is stored as base64 in the existing TEXT columns: it has to
# cross Tauri's JSON command IPC (UTF-8 only -- raw ciphertext bytes are not
# valid UTF-8) and tauri-plugin-sql's string bind parameters either way, and
# base64 is the most compact text-safe encoding that satisfies both without
# a BLOB-column schema change.
base64 = "0.22"
# crypto.rs: back screen_time_session.app_id_hash, a deterministic "blind
# index" that lets getScreenTimeForDate's GROUP BY and import.rs's duplicate
# check keep working on app_id/display_name once those columns are
# encrypted with crypto.rs's usual random-nonce scheme (which, by design,
# never produces the same ciphertext twice -- see that module's doc
# comment). hkdf derives a dedicated HMAC subkey from the existing 32-byte
# AEAD key (desktop only -- Android's Keystore key is non-exportable, so it
# uses a second, independently generated Keystore HMAC key instead, see
# android_bridge.rs/NativeBridgePlugin.kt) so the same raw key is never used
# for both encryption and a MAC. All three are already pulled in
# transitively by spake2/snow/sqlx/keyring at the versions pinned here, so
# adding them directly costs no new versions in the dependency tree.
hmac = "0.12"
hkdf = "0.12"
sha2 = "0.10"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-global-shortcut = "2"
tauri-plugin-autostart = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
# Desktop-only, like the plugins above: enforces a single running instance
# (see run() in src/lib.rs) so a second launch -- e.g. from an autostart
# entry racing a still-running instance -- focuses the existing window
# instead of spawning a second Tauri/WebView runtime.
tauri-plugin-single-instance = "2"
# p2p_sync.rs: LAN service advertise/browse. Desktop only -- Android has no
# portable Rust mDNS and instead goes through NsdManager via
# android_bridge.rs/NativeBridgePlugin.kt, same split as every other
# Android-only capability here. The TCP pairing/sync connection itself
# (tokio::net) and the pairing/transport crypto (spake2/snow, base
# [dependencies] above) are NOT platform-gated -- only discovery is.
mdns-sd = "0.11"
# system_info.rs: OS name/version string for the About page's "Export system
# info" report. Desktop only -- Android's OS version comes from
# Build.VERSION.RELEASE via android_bridge.rs/NativeBridgePlugin.kt instead.
os_info = "3"
# key_store.rs: the password-protected key file. argon2 derives the key-
# encryption key from the user's password (Argon2id, memory-hard, so a stolen
# key file can't be brute-forced cheaply); zeroize wipes the password and
# derived key from memory once used. Desktop only -- Android's key is a
# non-exportable Keystore key with no file to protect.
argon2 = "0.5"
zeroize = "1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    # SetWinEventHook/HWINEVENTHOOK/WINEVENT_OUTOFCONTEXT (Accessibility),
    # OpenProcess/QueryFullProcessImageNameW (Threading), and
    # GetFileVersionInfoW/VerQueryValueW (Storage_FileSystem) back
    # screen_time.rs's foreground-focus watcher -- the hook itself, resolving
    # the focused window's exe name, and reading its FileDescription for a
    # friendly display name (e.g. "Google Chrome" for chrome.exe) respectively.
    "Win32_UI_Accessibility",
    "Win32_System_Threading",
    "Win32_Storage_FileSystem",
    "Media_Control",
] }
# crypto.rs's at-rest key store. keyring 3 has NO default features -- the
# backend must be named explicitly per platform, and a build that names none
# silently falls back to an in-memory mock store (i.e. nothing persists),
# which here would mean a brand-new key every launch and every previously
# encrypted reflection becoming permanently unreadable. crypto.rs therefore
# verifies a freshly stored key can actually be read back before trusting
# the store, and falls back to its own key file if it can't.
keyring = { version = "3", features = ["windows-native"] }

[target.'cfg(target_os = "macos")'.dependencies]
# "exception" feature: lets macos_overlay.rs catch an Objective-C exception
# from -setPresentationOptions: instead of letting it abort the process (see
# that file's doc comment on enter_kiosk_mode for why this only helps in dev
# builds -- release uses panic = "abort", see Cargo.toml's [profile.release]).
objc2 = { version = "0.6.4", features = ["exception"] }
objc2-app-kit = "0.3.2"
# NSNotificationCenter observer block in screen_time.rs (already in the lockfile transitively).
block2 = "0.6.2"
objc2-core-graphics = "0.3.2"
objc2-foundation = "0.3.2"
# See the Windows block above for why the backend feature is explicit. macOS
# Keychain is the one desktop store with real per-app access control -- but
# that ACL is keyed to code identity, and this build is unsigned/ad-hoc
# (see CLAUDE.md), so the grant can be dropped by a rebuild exactly the way
# the media-key TCC grant already is. crypto.rs's file fallback is what
# keeps that from becoming a hard failure.
keyring = { version = "3", features = ["apple-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
mpris = "2"
x11rb = "0.13"
# See the Windows block above for why the backend feature is explicit.
# sync- rather than async-secret-service: keyring's own access is synchronous
# either way, so the async variant would only add an async runtime for
# nothing. crypto-rust adds encrypted D-Bus transport for the secret without
# dragging in OpenSSL (crypto-openssl is the other, mutually exclusive
# option). Needs libdbus-1-dev at build time -- added to release.yml's Linux
# dependency install for this. A session with no Secret Service daemon at all
# (headless/minimal installs) is expected and handled: crypto.rs falls back
# to its own key file there, same spirit as this app's tray icon needing a
# desktop-environment extension it can't install itself.
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust"] }

[dev-dependencies]
chrono-tz = "0.10.4"
