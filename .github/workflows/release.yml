name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        # macos-latest is an Apple Silicon (aarch64) runner. The macOS leg below
        # passes --target universal-apple-darwin so the resulting .dmg/.app is a
        # universal binary (arm64 + x86_64) that runs natively on Intel Macs too,
        # not just Apple Silicon.
        #
        # Linux ships AppImage only (see tauri.linux.conf.json), not deb/rpm --
        # AppImage is the only Linux format tauri-plugin-updater currently
        # auto-updates, so this keeps Linux consistent with how Windows/macOS
        # already auto-update. Don't add deb/rpm targets without also solving
        # updates for them.
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Linux build dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf build-essential curl wget file libssl-dev libgtk-3-dev libx11-dev

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Add macOS universal build targets
        if: matrix.os == 'macos-latest'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Install frontend dependencies
        run: npm ci

      - name: Generate PR-based release notes
        id: pr_notes
        uses: actions/github-script@v7
        with:
          script: |
            const { data } = await github.rest.repos.generateReleaseNotes({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: "${{ github.ref_name }}",
              target_commitish: "${{ github.sha }}",
            });
            core.setOutput('body', data.body);

      - name: Generate commit-log release notes
        id: commit_notes
        shell: bash
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 "${{ github.ref_name }}^" 2>/dev/null || echo "")
          if [ -n "$PREV_TAG" ]; then
            RANGE="$PREV_TAG..${{ github.ref_name }}"
          else
            RANGE="${{ github.ref_name }}"
          fi
          {
            echo 'body<<EOF'
            echo '### Commits'
            git log "$RANGE" --pretty=format:"- %s" --no-merges
            echo
            echo EOF
          } >> "$GITHUB_OUTPUT"

      - name: Build and publish release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          args: ${{ matrix.os == 'macos-latest' && '--target universal-apple-darwin' || '' }}
          tagName: ${{ github.ref_name }}
          releaseName: "Reflectodoro v__VERSION__"
          releaseBody: |
            ${{ steps.pr_notes.outputs.body }}

            ${{ steps.commit_notes.outputs.body }}
          releaseDraft: false
          prerelease: false
