name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        # macos-latest is an Apple Silicon (aarch64) runner. The macOS leg below
        # passes --target universal-apple-darwin so the resulting .dmg/.app is a
        # universal binary (arm64 + x86_64) that runs natively on Intel Macs too,
        # not just Apple Silicon.
        #
        # Linux ships AppImage only (see tauri.linux.conf.json), not deb/rpm --
        # AppImage is the only Linux format tauri-plugin-updater currently
        # auto-updates, so this keeps Linux consistent with how Windows/macOS
        # already auto-update. Don't add deb/rpm targets without also solving
        # updates for them.
        #
        # ubuntu-latest is x86_64 (covers Intel and AMD desktops, both amd64 --
        # not a real gap like macOS Intel/arm64). ubuntu-24.04-arm is a native
        # GitHub-hosted arm64 runner, added for arm64 Linux devices (Raspberry
        # Pi-class boards, arm laptops). Built natively rather than cross-compiled
        # since cross-compiling Tauri's GTK/webkit2gtk deps from x86_64 is fragile.
        os: [windows-latest, macos-latest, ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Linux build dependencies
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf build-essential curl wget file libssl-dev libgtk-3-dev libx11-dev xdg-utils

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable (as of 2026-09-03)

      - name: Add macOS universal build targets
        if: matrix.os == 'macos-latest'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Install frontend dependencies
        run: npm ci

      - name: Generate PR-based release notes
        id: pr_notes
        uses: actions/github-script@v7
        env:
          # Passed through env, not textually substituted into the script
          # below: a tag name only has to avoid the small set of characters
          # git itself forbids in refs (space, ~, ^, :, ?, *, [, \,
          # control chars) -- it can still contain ", $, `, (, ), ;, &, |,
          # which would otherwise let a maliciously crafted tag break out of
          # the string literal and run arbitrary code with this step's
          # github-script token. process.env is the injection-safe way to
          # get untrusted values into a github-script body.
          TAG_NAME: ${{ github.ref_name }}
        with:
          script: |
            const { data } = await github.rest.repos.generateReleaseNotes({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: process.env.TAG_NAME,
              target_commitish: "${{ github.sha }}",
            });
            core.setOutput('body', data.body);

      - name: Generate commit-log release notes
        id: commit_notes
        shell: bash
        env:
          # Same reasoning as the step above, for the shell case: passed
          # through env and referenced as "$TAG_NAME" rather than
          # interpolated directly into this script, since a tag name can
          # contain shell metacharacters ($, `, ;, &, |, (, ), ") that
          # would otherwise let a crafted tag run arbitrary commands here.
          TAG_NAME: ${{ github.ref_name }}
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 "$TAG_NAME^" 2>/dev/null || echo "")
          if [ -n "$PREV_TAG" ]; then
            RANGE="$PREV_TAG..$TAG_NAME"
          else
            RANGE="$TAG_NAME"
          fi
          {
            echo 'body<<EOF'
            echo '### Commits'
            git log "$RANGE" --pretty=format:"- %s" --no-merges
            echo
            echo EOF
          } >> "$GITHUB_OUTPUT"

      - name: Build and publish release
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          args: ${{ matrix.os == 'macos-latest' && '--target universal-apple-darwin' || '' }}
          tagName: ${{ github.ref_name }}
          releaseName: "Reflectodoro v__VERSION__"
          releaseBody: |
            ${{ steps.pr_notes.outputs.body }}

            ${{ steps.commit_notes.outputs.body }}
          releaseDraft: false
          prerelease: false

      # linuxdeploy (which tauri-action's `tauri build` just ran) bundles
      # THIS RUNNER's libwayland-client/cursor/egl/server into the AppImage,
      # not just the app's real dependencies. That's fine when the AppImage
      # is built and run on the same machine, but this runner's Ubuntu image
      # has a different Wayland/Mesa stack than wherever the AppImage is
      # actually installed -- which is exactly what produced
      # `undefined symbol: wl_fixes_interface` / `EGL_BAD_PARAMETER` in
      # testing (see src-tauri/scripts/fix-appimage.sh's header comment for
      # the full story). Stripping those bundled libs here means the release
      # artifact behaves like the manually-patched AppImages that were
      # confirmed to work, instead of shipping the same bug to every user.
      #
      # Re-signing: this repo has createUpdaterArtifacts on, so the step
      # above already produced a .sig for the ORIGINAL AppImage; repackaging
      # changes the bytes, so that .sig is now stale. fix-appimage.sh
      # re-signs automatically whenever TAURI_SIGNING_PRIVATE_KEY is set
      # (it is, below) -- same script, same env vars as a local build.
      #
      # Deliberately only replaces this leg's own AppImage/.sig assets here
      # (uniquely named per architecture, so no risk of the two Linux legs
      # colliding). It does NOT touch latest.json -- ubuntu-latest and
      # ubuntu-24.04-arm run concurrently, and the GitHub Releases API has
      # no compare-and-swap, so two legs racing to read-modify-write the
      # same shared file could silently drop one platform's entry. See the
      # separate fix-linux-updater-manifest job below, which waits for the
      # whole matrix and patches latest.json exactly once.
      - name: Fix and re-sign Linux AppImage
        if: startsWith(matrix.os, 'ubuntu')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # See the release-notes steps above for why this goes through env
          # rather than direct "${{ github.ref_name }}" interpolation.
          TAG_NAME: ${{ github.ref_name }}
        run: |
          bash src-tauri/scripts/fix-appimage.sh
          gh release upload "$TAG_NAME" \
            src-tauri/target/release/bundle/appimage/*.AppImage \
            src-tauri/target/release/bundle/appimage/*.AppImage.sig \
            --clobber

  # Runs once, after every leg of the matrix above has finished (same
  # `needs: release` pattern the android job below already uses) -- see the
  # "Fix and re-sign Linux AppImage" step's comment for why patching the
  # shared latest.json can't safely happen inside either Linux leg directly.
  # By the time this job starts, both Linux legs have already replaced their
  # own AppImage/.sig assets on the release with the fixed, re-signed
  # versions; this job's only work is teaching latest.json about the new
  # signatures (the .sig file's raw content is exactly what the updater
  # manifest's "signature" field expects -- see
  # https://v2.tauri.app/plugin/updater/).
  fix-linux-updater-manifest:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Patch latest.json with the re-signed Linux signatures
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # See the release job's release-notes steps for why this goes
          # through env rather than direct "${{ github.ref_name }}"
          # interpolation. github.repository doesn't need the same
          # treatment -- it's the repo's own owner/name, fixed by GitHub,
          # not attacker-influenceable the way a pushed tag's name is.
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          rm -rf manifest-fix && mkdir manifest-fix
          gh release download "$TAG_NAME" -R "${{ github.repository }}" \
            --pattern 'latest.json' --pattern '*.AppImage.sig' --dir manifest-fix
          cd manifest-fix

          patched=false
          for sig in *.AppImage.sig; do
            [ -f "$sig" ] || continue
            case "$sig" in
              *aarch64*|*arm64*) key=linux-aarch64 ;;
              *amd64*|*x86_64*|*x86-64*) key=linux-x86_64 ;;
              *)
                echo "::warning::couldn't tell which platform $sig belongs to (unrecognized arch token in filename) -- leaving latest.json's entry for it untouched"
                continue
                ;;
            esac
            signature="$(cat "$sig")"
            jq --arg key "$key" --arg sig "$signature" \
              '.platforms[$key].signature = $sig' latest.json > latest.json.tmp
            mv latest.json.tmp latest.json
            echo "patched $key from $sig"
            patched=true
          done

          if [ "$patched" != true ]; then
            echo "::error::no *.AppImage.sig assets found on the release -- nothing to patch, refusing to re-upload latest.json unchanged"
            exit 1
          fi

          gh release upload "$TAG_NAME" -R "${{ github.repository }}" \
            latest.json --clobber

  android:
    # Waits for every desktop leg above so the GitHub Release already exists
    # (created by tauri-action) before this uploads an extra asset to it --
    # a separate job because the Android toolchain (JDK, Android SDK/NDK,
    # Gradle) has nothing in common with the desktop matrix's native deps.
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0 ndk;26.1.10909125"

      # arm64-v8a covers virtually every real Android phone since ~2017;
      # armeabi-v7a covers what's left of older 32-bit phones. i686/x86_64
      # only matter for Android emulators, not real devices, so they're
      # skipped here to cut build time and release-asset count.
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable (as of 2026-09-03)
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi

      - name: Install frontend dependencies
        run: npm ci

      # Decodes the release upload keystore from a repo secret into a temp
      # file outside the repo tree (never written into the checkout, never
      # committed). build.gradle.kts's release signingConfig only activates
      # when ANDROID_KEYSTORE_PATH is set, so a fork/PR build without this
      # secret still falls back to the previous unsigned-debug behavior
      # instead of failing.
      - name: Decode Android signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/reflectodoro-release.keystore"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/reflectodoro-release.keystore" >> "$GITHUB_ENV"
          fi

      # Real release build now that a signing keystore is configured (see
      # the decode step above and build.gradle.kts's signingConfigs block).
      # --split-per-abi avoids bundling all 4 ABIs' native libs into one
      # universal APK; combined with the release profile's strip/LTO
      # (Cargo.toml) this is what actually fixes the ~600MB debug/universal
      # APK the old --debug build produced.
      - name: Build Android APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          export NDK_HOME="$ANDROID_HOME/ndk/26.1.10909125"
          export ANDROID_NDK_HOME="$NDK_HOME"
          npm run tauri android build -- --apk --split-per-abi --target aarch64 armv7

      - name: Upload APK to release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # See the release job's release-notes steps for why this goes
          # through env rather than direct "${{ github.ref_name }}"
          # interpolation.
          TAG_NAME: ${{ github.ref_name }}
        run: |
          gh release upload "$TAG_NAME" \
            src-tauri/gen/android/app/build/outputs/apk/*/release/*.apk \
            --clobber
